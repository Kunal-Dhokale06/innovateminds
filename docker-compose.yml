version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: modelrouter-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./modelrouter.db
      - LOG_LEVEL=INFO
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: modelrouter-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
